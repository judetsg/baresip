; Dialplan for the doorbell device
; Contexts: internal (normal calls), ivr-main (greeting menu)

[general]
static=yes
writeprotect=no
clearglobalvars=no

; ============================================================
; INTERNAL: normal calls between extensions + feature codes
; ============================================================
[internal]

; --- Echo test (audio check) ---
exten => *43,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- Playback sanity test ---
exten => *44,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Hangup()

; --- Voicemail: check your own mailbox ---
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)})
 same => n,Hangup()

; --- Direct extension dialing ---
exten => visitor,1,Gosub(record-call,s,1)
 same => n,Dial(PJSIP/visitor,20)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
 same => n(busy),VoiceMail(visitor,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(visitor,u)
 same => n,Hangup()

exten => owner,1,Gosub(record-call,s,1)
 same => n,Dial(PJSIP/owner,20)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
 same => n(busy),VoiceMail(owner,b)
 same => n,Hangup()
 same => n(unavail),VoiceMail(owner,u)
 same => n,Hangup()

; --- IVR entry point ---
exten => 9999,1,Goto(ivr-main,s,1)

; ============================================================
; IVR: greeting menu
; ============================================================
[ivr-main]
exten => s,1,Answer()
 same => n,Set(TRIES=0)
 same => n(menu),Background(custom/welcome)
 same => n,WaitExten(5)

; Digit 1 -> leave a message (voicemail for owner)
exten => 1,1,VoiceMail(owner,u)
 same => n,Hangup()

; Digit 2 -> ring the owner
exten => 2,1,Gosub(record-call,s,1)
 same => n,Dial(PJSIP/owner,20)
 same => n,VoiceMail(owner,u)
 same => n,Hangup()

; Digit 3 -> repeat the menu
; Digit 0 -> repeat the menu (convenience alias)
exten => 3,1,Goto(s,menu)
exten => 0,1,Goto(s,menu)

; Invalid digit
exten => i,1,Set(TRIES=$[${TRIES}+1])
 same => n,GotoIf($[${TRIES} >= 3]?hangup:reprompt)
 same => n(reprompt),Playback(invalid)
 same => n,Goto(s,menu)
 same => n(hangup),Playback(goodbye)
 same => n,Hangup()

; Timeout (no digit pressed)
exten => t,1,Playback(goodbye)
 same => n,Hangup()

; ============================================================
; Subroutine: start call recording
; ============================================================
[record-call]
exten => s,1,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,Return()