; PJSIP configuration for the doorbell device
; Two endpoints: visitor (doorbell side) and owner (house side)

; ---- Transport (UDP) ----
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- Endpoint: visitor ----
[visitor]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=h264
allow=vp8
auth=visitor-auth
aors=visitor
callerid="Visitor" <visitor>
trust_id_inbound=yes

[visitor-auth]
type=auth
auth_type=userpass
username=visitor
password=pass_visitor

[visitor]
type=aor
max_contacts=1
remove_existing=yes

; ---- Endpoint: owner ----
[owner]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=h264
allow=vp8
auth=owner-auth
aors=owner
callerid="Owner" <owner>
trust_id_inbound=yes

[owner-auth]
type=auth
auth_type=userpass
username=owner
password=pass_owner

[owner]
type=aor
max_contacts=1
remove_existing=yes